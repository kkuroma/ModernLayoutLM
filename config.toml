# Where things live, `data` symlinks to the vault, `models` and `packed` are local disk
[Paths]
raw_dir = "data/raw"                       # datasets exactly as downloaded
processed_dir = "data/processed"           # canonical parquet, our schema
pack_dir = "packed"                        # tokenized pretraining packs, local as random HDD reads starve the GPU
checkpoint_dir = "data/checkpoints"        # training checkpoints
backbone_dir = "models/backbones"          # pulled upstream weights
export_dir = "data/exports"                # final HF-format models, on the vault
report_dir = "notebooks/results"           # evaluation tables

# Stage 1: layout-aware masked language modelling, in two phases
# 1. Mask the text, leave the boxes, so recovering a token rewards reading its position
# 2. Rows are packed into full windows, and a row longer than one spans several
# 3. Backbone and the fresh 2D tables train at separate rates
# 4. Short windows of single pages first, then long windows of whole documents
[Pretrain]
datasets = ["idl", "pubtables", "pdfa", "doclaynet", "idl-fresh"]
max_length = 512                           # single pages, the cheapest tokens per second
steps = 144908                             # the shipped weights ran 29899 on the first four corpora, then 115009 on idl-fresh
mlm_probability = 0.3                      # ModernBERT's recipe, not BERT's 0.15
learning_rate = 5e-5                       # pretrained backbone
layout_learning_rate = 1e-3                # fresh 2D tables, they start from zero
weight_decay = 0.01
warmup_ratio = 0.05
max_pages_per_source = 8800000             # idl-fresh's share of the 11M pages
batch_size = 32                            # fits only as the MLM head scores masked tokens alone
grad_accum = 2
save_total_limit = 2                       # 0 keeps every checkpoint, at 1.9GB each
keep_every = 0                             # also keep the weights of every Nth step, 0 keeps none
pack_rows = 2000                           # rows per packing call, each held in memory by one process
pack_workers = 12

# Phase 2 continues phase 1 and inherits every key it does not set
[Pretrain.long]
datasets = ["idl-docs"]
max_length = 2048                          # whole documents, as 512 alone lost the use of context past 2048
steps = 28000                              # 917M tokens, about 6 hours at 45k tokens per second
batch_size = 8                             # the same 32k tokens per step as phase 1
keep_every = 6000
pack_rows = 330                            # a row is a whole document of about 6 pages, so 2000 overran 61GB of RAM
pack_workers = 6

# Stage 2: downstream supervised fine-tuning
# 1. Token classification for FUNSD, CORD, SROIE and RealKIE
# 2. Per-task overrides below, since the corpora differ by three orders of magnitude
[Finetune]
max_length = 1024
learning_rate = 3e-4                       # ours and the ModernBERT controls, 1e-4 and 5e-4 no better on FUNSD at 11M pages
baseline_learning_rate = 5e-5              # LayoutLM v1 at its paper's rate
layout_learning_rate = 1e-4
weight_decay = 0.01
warmup_ratio = 0.1
epochs = 20
batch_size = 8
grad_accum = 2
label_all_subwords = false                 # label the first subword, -100 on the rest

# Small corpora, a few hundred pages each, so they need many more passes
[Finetune.funsd]
epochs = 30

[Finetune.cord]
epochs = 30

[Finetune.sroie]
epochs = 30

# RealKIE, multi-page documents, so a long window and one document per step
[Finetune.realkie-fcc]
epochs = 10
max_length = 4096
batch_size = 1
grad_accum = 8

[Finetune.realkie-nda]
epochs = 10
max_length = 4096
batch_size = 1
grad_accum = 8

[Finetune.realkie-charities]
epochs = 10
max_length = 4096
batch_size = 1
grad_accum = 8
